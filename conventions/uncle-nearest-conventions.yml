summary: >-
  Uncle Nearest publishes no API conventions of its own. Every cross-cutting semantic below is inherited from
  WordPress core REST and The Events Calendar plugin as deployed on unclenearest.com, and is recorded here as observed
  from the two live OpenAPI documents and the route index — not as a provider commitment.
authentication:
  style: none-for-published-reads
  writes: HTTP Basic with a WordPress application password, or logged-in cookie plus X-WP-Nonce header
  declared_scheme: BasicAuth (http/basic) — declared in tec/v1 components.securitySchemes, not applied per operation
  detail: authentication/uncle-nearest-authentication.yml
  anonymous_reads_confirmed: true
idempotency:
  supported: false
  header: null
  note: >-
    No Idempotency-Key header or equivalent exists anywhere in either spec or in the WordPress route index. Retrying a
    POST creates a duplicate record. DELETE is naturally idempotent in effect (repeat calls return 410).
pagination:
  style: page-number
  params:
  - name: page
    default: 1
  - name: per_page
    default: 10
    max: 100
  response_headers:
  - X-WP-Total
  - X-WP-TotalPages
  - Link
  response_fields:
