apis:
- name: Uncle Nearest WordPress REST API
  description: >-
    The standard WordPress core REST API exposed at unclenearest.com/wp-json/, publishing the brand's
    posts, pages, media, categories, tags, taxonomies and custom event post types as JSON. The route index
    at the base URL is the machine-readable discovery document; no OpenAPI is published for it. Anonymous
    reads are permitted for published content, all writes require authentication.
  humanURL: https://unclenearest.com/
  baseURL: https://unclenearest.com/wp-json/
