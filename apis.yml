apis:
- name: Uncle Nearest Events Calendar REST API (tribe/events/v1)
  description: >-
    Read-only-by-default REST API for the events, venues, organizers, event categories and event tags published on
    unclenearest.com, served by The Events Calendar plugin from the brand's own WordPress host. The API self-publishes
    an OpenAPI 3.0.0 document at its /doc endpoint. Anonymous callers may read published events; write operations
    require WordPress authentication.
  humanURL: https://unclenearest.com/live/
  baseURL: https://unclenearest.com/wp-json/tribe/events/v1/
  tags:
  - events
  - venues
  - calendar
  - wordpress
  - hospitality
  properties:
  - type: OpenAPI
    url: openapi/uncle-nearest-events-calendar-v1-openapi.json
  - type: APIReference
    url: https://unclenearest.com/wp-json/tribe/events/v1/doc
  - type: Documentation
    name: The Events Calendar REST API documentation (upstream vendor)
    url: https://theeventscalendar.com/knowledgebase/the-events-calendar-rest-api/
  - type: Overlay
    url: overlays/uncle-nearest-events-calendar-v1-overlay.yaml
- name: Uncle Nearest Events Calendar REST API (tec/v1)
  description: >-
    Second-generation Events Calendar REST API on the same host, covering events, organizers, venues and series with
    named operationIds. Self-publishes an OpenAPI 3.0.4 document at its /docs endpoint. Reads are anonymous for
    published content; creates, updates and deletes require WordPress authentication.
  humanURL: https://unclenearest.com/live/
  baseURL: https://unclenearest.com/wp-json/tec/v1
  tags:
  - events
  - venues
  - calendar
  - wordpress
  - hospitality
  properties:
  - type: OpenAPI
    url: openapi/uncle-nearest-tec-v1-openapi.json
  - type: APIReference
    url: https://unclenearest.com/wp-json/tec/v1/docs
  - type: Documentation
    name: The Events Calendar REST API documentation (upstream vendor)
    url: https://theeventscalendar.com/knowledgebase/the-events-calendar-rest-api/
  - type: Overlay
    url: overlays/uncle-nearest-tec-v1-overlay.yaml
- name: Uncle Nearest WordPress REST API
  description: >-
    The standard WordPress core REST API exposed at unclenearest.com/wp-json/, publishing the brand's posts, pages,
    media, categories, tags, taxonomies and custom event post types as JSON. The route index at the base URL is the
    machine-readable discovery document; no OpenAPI is published for it. Anonymous reads are permitted for published
    content, all writes require authentication.
  humanURL: https://unclenearest.com/
  baseURL: https://unclenearest.com/wp-json/
  tags:
  - content
  - cms
  - wordpress
  properties:
  - type: APIReference
    name: WordPress REST route discovery index
    url: https://unclenearest.com/wp-json/
  - type: Documentation
    name: WordPress REST API handbook (upstream)
    url: https://developer.wordpress.org/rest-api/
