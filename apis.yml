aid: uncle-nearest
name: Uncle Nearest
description: >-
  Uncle Nearest, Inc. is an American whiskey company headquartered in Shelbyville, Tennessee, founded in 2017 by Fawn
  Weaver and Keith Weaver and named for Nathan "Nearest" Green, the formerly enslaved master distiller who taught Jack
  Daniel the craft. The company produces the Uncle Nearest 1856 Premium Aged, 1884 Small Batch, Master Blend, Single
  Barrel, Straight Rye and Uncut/Unfiltered Rye expressions, and operates the Nearest Green Distillery visitor
  destination in Shelbyville with tours, tastings, private events and a retail shop. Uncle Nearest is a privately held,
  consumer-facing brand with no developer program and no product API; its only public machine-readable surfaces are the
  WordPress REST API and the two OpenAPI-documented Events Calendar REST APIs served from its own web host at
  unclenearest.com, which expose the brand's published events, venues and organizers as read-only JSON.
