  policy_url: null
  owner: upstream plugin vendor (The Events Calendar), not Uncle Nearest
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  note: >-
    No RFC 8594 Sunset or Deprecation header appears in either spec or in observed responses. tribe/events/v1 is the
    older generation superseded by tec/v1 on the same host, but no deprecation of it is announced.
