summary: >-
  Uncle Nearest publishes no API lifecycle commitments — no versioning policy, no deprecation policy, no SLA, no
  status page and no changelog. The only versioning signal is the URI namespace of the two Events Calendar APIs, which
  is set by the upstream plugin rather than by the brand. Because no status page or deprecation policy exists, no
  StatusPage or Deprecation pointer is emitted in apis.yml.
